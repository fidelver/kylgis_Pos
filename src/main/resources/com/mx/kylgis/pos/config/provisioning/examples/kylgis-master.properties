# KylGis POS MASTER example
# Shared configuration belongs here. Node modules only override what differs.

config.secrets=secrets.properties

# Human-readable database settings. JDBC db.* keys remain supported.
database.server=!secret.bbdd_server
database.port=3306
database.user=!secret.bbdd_user
database.password=!secret.bbdd_password

database.options=?zeroDateTimeBehavior=convertToNull

# Installation topology: add as many nodes as the operation requires.
node.caja1.module=nodes/caja1.properties
node.caja2.module=nodes/caja2.properties
node.cocina.module=nodes/cocina.properties
node.bar.module=nodes/bar.properties
